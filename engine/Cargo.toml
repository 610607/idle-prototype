[package]
name = "idle_engine"
version = "0.1.0"
edition = "2021"
description = "Deterministic rules engine for the idle prototype (v1): board, routes, garrisons, surges, population, battles."
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "=0.2.130", optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[[example]]
name = "bot_policy"
path = "examples/bot_policy.rs"
crate-type = ["lib"]
test = false

# The evaluation tool's own tests (metric registry, smoke runs) run under `cargo test`.
[[example]]
name = "eval"
path = "examples/eval/main.rs"
test = true
