[package]
name = "idle_engine"
version = "0.1.0"
edition = "2021"
description = "Deterministic rules engine for the idle prototype (v1): board, routes, garrisons, surges, population, battles."
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "=0.2.130", optional = true }

# `evalkit/` is the evaluation kit (reference bot, measured runs, evaluator) and the programs that
# use it. Both are default members, so `cargo test`, `cargo fmt` and `cargo run --example <name>`
# in `engine/` cover both crates.
[workspace]
members = [".", "evalkit"]
default-members = [".", "evalkit"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
